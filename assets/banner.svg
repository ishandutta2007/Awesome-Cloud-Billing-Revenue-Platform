<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#090d1f" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-40px, -25px) scale(1.1); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseFlow {
      0% { stroke-dashoffset: 400; opacity: 0.3; }
      50% { opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes cardFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .orb-cyan {
      animation: floatOrb1 10s ease-in-out infinite;
    }
    .orb-purple {
      animation: floatOrb2 12s ease-in-out infinite;
    }
    .data-wire {
      stroke-dasharray: 20, 10;
      animation: pulseFlow 8s linear infinite;
    }
    .float-card-1 {
      animation: cardFloat 6s ease-in-out infinite;
    }
    .float-card-2 {
      animation: cardFloat 7s ease-in-out infinite 1.5s;
    }
    .float-card-3 {
      animation: cardFloat 8s ease-in-out infinite 3s;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g opacity="0.6">
    <circle class="orb-cyan" cx="200" cy="90" r="130" fill="url(#accentCyan)" filter="url(#glowCyan)" />
    <circle class="orb-purple" cx="1020" cy="310" r="160" fill="url(#accentPurple)" filter="url(#glowPurple)" />
  </g>

  <!-- Flowing Dynamic Curved Circuit/Stream Lines in Background -->
  <g fill="none" opacity="0.45">
    <path class="data-wire" d="M 0,160 Q 350,60 650,220 T 1200,140" stroke="#38bdf8" stroke-width="2.5" />
    <path class="data-wire" d="M 0,280 Q 450,380 750,200 T 1200,320" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Subtle Floating UI Data Cards (Background Accent) -->
  <g opacity="0.85">
    <!-- Card 1: Subscription / Recurring -->
    <g class="float-card-1" transform="translate(60, 290)">
      <rect width="210" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="35" r="14" fill="#38bdf8" fill-opacity="0.2" />
      <text x="28" y="40" font-size="14" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">⚡</text>
      <text x="54" y="31" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Recurring Engine</text>
      <text x="54" y="49" fill="#94a3b8" font-size="11" font-family="sans-serif">Automated Invoicing</text>
    </g>

    <!-- Card 2: Usage Metering -->
    <g class="float-card-2" transform="translate(930, 60)">
      <rect width="210" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="35" r="14" fill="#818cf8" fill-opacity="0.2" />
      <text x="28" y="40" font-size="14" fill="#818cf8" text-anchor="middle" font-family="sans-serif">📊</text>
      <text x="54" y="31" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Usage Metering</text>
      <text x="54" y="49" fill="#94a3b8" font-size="11" font-family="sans-serif">High-Throughput Events</text>
    </g>

    <!-- Card 3: RevRec / ASC 606 -->
    <g class="float-card-3" transform="translate(950, 280)">
      <rect width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="35" r="14" fill="#c084fc" fill-opacity="0.2" />
      <text x="28" y="40" font-size="14" fill="#c084fc" text-anchor="middle" font-family="sans-serif">⚖️</text>
      <text x="54" y="31" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">RevRec &amp; Ledger</text>
      <text x="54" y="49" fill="#94a3b8" font-size="11" font-family="sans-serif">ASC 606 / IFRS 15</text>
    </g>
  </g>

  <!-- FOREGROUND: Crystal Clear Titles & Badges -->
  <g id="foreground-content">
    <!-- Category Pill -->
    <g transform="translate(600, 75)">
      <rect x="-180" y="0" width="360" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-158" cy="17" r="5" fill="#38bdf8" />
      <text x="-142" y="22" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600" letter-spacing="1">CURATED MONETIZATION STACK</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="165" text-anchor="middle" font-size="46" fill="url(#primaryGrad)">
      Cloud Billing &amp; Revenue Platforms
    </text>

    <!-- Subtitle / Tagline -->
    <text class="sub-text" x="600" y="215" text-anchor="middle" font-size="20" fill="#f1f5f9" opacity="0.95">
      The Definitive Guide to Subscription Billing, Usage Metering &amp; RevOps
    </text>

    <!-- Secondary Tagline -->
    <text class="sub-text" x="600" y="250" text-anchor="middle" font-size="14" fill="#94a3b8">
      Enterprise SaaS Monetization • Self-Hosted Billing Engines • Hybrid Pricing &amp; Metering APIs
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(600, 290)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="0" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="19" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">💳 Subscription Billing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="0" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="80" y="19" fill="#818cf8" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">📈 Usage-Based Pricing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="19" fill="#c084fc" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">🔓 Open-Source Engines</text>
      </g>
    </g>
  </g>
</svg>
